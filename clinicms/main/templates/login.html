{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background-image: url("{% static 'images/clinic-bg.jpg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .login-box {
    background-color: rgba(0, 0, 0, 0.45);
    padding: 40px;
    border-radius: 20px;
    width: 90%;
    max-width: 450px;
    text-align: center;
    color: #fff;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
  }

  .login-box h2,
  .login-box p,
  .login-box label {
    color: #ffffff;
  }

  .transparent-input {
    background-color: rgba(255, 255, 255, 0.15);
    border: none;
    border-bottom: 2px solid #fff;
    color: #fff;
    width: 100%;
    padding: 10px;
  }

  .transparent-input::placeholder {
    color: #ddd;
  }

  .transparent-input:focus {
    background-color: rgba(255, 255, 255, 0.25);
    outline: none;
    border-bottom: 2px solid #00c3ff;
  }

  .btn-custom {
    background-color: #007bff;
    border: none;
    width: 100%;
    padding: 10px;
    font-weight: bold;
    transition: background-color 0.3s ease;
    margin-top: 15px;
    color: white;
  }

  .btn-custom:hover {
    background-color: #0056b3;
  }
</style>

<div class="login-wrapper">
  <div class="login-box">
    <h2 class="mb-3">Welcome to Shreenath's Clinic</h2>
    <p class="mb-3 fst-italic">
      "Welcome to your control center — where managing care is simple, smooth, and just a click away."
    </p>

    <h4 class="mb-2">Login</h4>
    <p class="mb-4 fst-italic">
      Please login using your <strong>Doctor</strong> or <strong>Receptionist</strong> credentials.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3 text-start">
        <label for="username" class="form-label">Username (Doctor or Receptionist):</label>
        <input type="text" name="username" id="username" class="form-control transparent-input" placeholder="Enter username" required>
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password:</label>
        <input type="password" name="password" id="password" class="form-control transparent-input" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-custom">Login</button>
    </form>
  </div>
</div>

{% endblock %}
